name: Dades

# Baixa les fonts obertes, genera les dades del joc i les desa a la mateixa branca.
on:
  push:
    branches: ["data/**"]
    paths: ["scripts/**", "dades/fonts.json", ".github/workflows/dades.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dades-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprova les fonts
        env:
          TMB_APP_ID: ${{ secrets.TMB_APP_ID }}
          TMB_APP_KEY: ${{ secrets.TMB_APP_KEY }}
        run: python3 scripts/comprova_fonts.py --sortida dades/generades/informe_fonts.txt

      - name: Explora les fonts de demanda (temporal)
        run: |
          pip install openpyxl==3.1.5
          python3 scripts/explora_demanda.py

      - name: Desa l'informe
        run: |
          git config user.name "polMarsol"
          git config user.email "polmarsoluni@gmail.com"
          git add dades/generades
          if git diff --cached --quiet; then
            echo "Cap canvi."
          else
            git commit -m "Informe de les fonts de dades"
            git push
          fi
