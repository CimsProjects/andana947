name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Les regles del joc en Kotlin pur (fase 2). Si encara no hi són, no hi ha res a provar.
      - name: Tests de les regles del joc
        if: hashFiles('joc/build.gradle.kts') != ''
        run: ./gradlew -p joc test --continue 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Compila l'app
        # Amb els secrets, l'APK de prova es connecta al servidor. Sense, compila igual amb el compte local.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERSIO_CODI: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --continue 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Tests unitaris de l'app
        run: ./gradlew :app:testDebugUnitTest --continue 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Lint
        run: ./gradlew :app:lintDebug --continue 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: APK de prova
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Informes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: informes
          path: |
            app/build/reports/
            joc/build/reports/
          if-no-files-found: ignore

      # L'últim pas: un resum dels errors, també com a anotació perquè es pugui llegir sense obrir el registre.
      - name: Resum d'errors
        if: failure()
        run: |
          {
            grep -E "^e: |^w: .*(error|Error)|What went wrong|FAILED|Error:|error:|tests completed|> .*Exception|lint found|Could not" build.log | grep -v "^\s*at " | head -80
            for f in app/build/test-results/testDebugUnitTest/*.xml; do grep -A4 "<failure" "$f" | head -30; done 2>/dev/null
            head -80 app/build/reports/lint-results.txt 2>/dev/null
          } > resum.txt || true
          cat resum.txt
          # Les anotacions no admeten salts de línia: es codifiquen.
          missatge=$(sed -e 's/%/%25/g' resum.txt | head -c 60000 | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=Resum d'errors::${missatge}"

  # Esquema de Supabase (migracions, RLS i funcions) en un Supabase local, mai contra el projecte de producció.
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Engega Supabase
        run: supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit

      - name: Tests de la base de dades
        if: hashFiles('supabase/tests/**') != ''
        run: supabase test db

      - name: Lint de la base de dades
        run: supabase db lint --schema public --level warning --fail-on warning
